name: pages
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - 'doc/**'
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - 'doc/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Check static website files
        run: test -f doc/index.html && test -d doc/static && test -f doc/.nojekyll

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Deploy static site to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: doc
